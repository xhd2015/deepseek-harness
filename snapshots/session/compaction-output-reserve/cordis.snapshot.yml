# The 1,800-token headroom fits inside the slack a 0.7 threshold ratio leaves in
# the 7,980-token message budget, so a 1,000-token output reservation lowers the
# trigger from 6,286 to 6,180, between the history and its condensed replacement.


- id: agent-instructions
  disabled: true

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.7
    headroomTokens: 1800
    retainTokens: 20
    maxTokens: 32

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8980
                defaultMaxTokens: 1000
    - id: compaction-working-directory
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/compaction-working-directory.ts'

# Fixed-budget compaction scenario: keep the recorded tool set, whose token counts the thresholds were tuned to.
- id: tool-fs
  config:
    applyPatch: false
